    'Bicycle': 0.5,
    'Bicycle Group': 0.5,
    'Pedestrian': 0.5,
    'Pedestrian Group': 0.5,
  }

  Z_HEIGHT: {
    'Sedan': 1.9,
    'Bus or Truck': 1.9,
    'Motorcycle': -1,
    'Bicycle': -1,
    'Bicycle Group': -1,
    'Pedestrian': 2,
    'Pedestrian Group': -1,
  }
